spring.application.name=CustomisationAgent

spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.ai.ollama.chat.model=qwen3:8b
#spring.ai.ollama.chat.model=qwen2.5-coder:7b
#spring.ai.ollama.chat.model=mistral
# Context window in tokens; Ollama's small default truncates the system prompt and tool definitions
spring.ai.ollama.chat.num-ctx=16384

# Logging Configuration
logging.level.root=INFO
logging.level.com.reedmanit.CustomisationAgent=DEBUG

# Spring AI & Ollama wire-level logging
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.ollama=DEBUG
logging.level.org.springframework.web.client.RestClient=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

